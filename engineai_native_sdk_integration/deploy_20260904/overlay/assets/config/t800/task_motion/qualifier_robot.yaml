# Restricted real-robot state graph for the independently deployed qualifier policy.
cpu:
  number: 3
  priority: 10

tasks:
  - motion: idle
    period: 0.002
    runner:
      - name: idle_runner
        enabled: true
    manual_transition: [passive]
    key: [LB, START]

  - motion: passive
    period: 0.002
    runner:
      - name: passive_runner
        enabled: true
    manual_transition: [idle, pd_stand, pd_stand_x, pd_stand_y]
    key: [LB, RB]

  - motion: pd_stand
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand
    manual_transition:
      - passive
      - pd_stand_x
      - pd_stand_y
      - walk
      - qualifier_front_kick
      - qualifier_straight_punch
      - qualifier_hook_punch
      - qualifier_jab_left
    key: [LB, A]

  - motion: walk
    period: 0.01
    runner:
      - name: rl_walking_example_runner
        enabled: true
        param_tag: rl_walking_example
    manual_transition: [passive, pd_stand]
    key: [RB, X]

  # Official URKL fall-recovery preparation poses. They remain independent
  # from the custom recovery policy because their trajectory contracts differ.
  - motion: pd_stand_x
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand_x
    manual_transition: [passive, pd_stand, pd_stand_y]
    key: [LB, X]

  - motion: pd_stand_y
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand_y
    manual_transition: [passive, pd_stand, pd_stand_x]
    key: [LB, Y]

  # Official public supine recovery definition retained for reproducibility.
  # It is currently quarantined: no state has a transition into it after the
  # 2026-09-05 hardware run produced out-of-range desired joint targets.
  - motion: supine_to_stance
    period: 0.01
    runner:
      - name: rl_mimic_trajectory_runner
        enabled: true
        param_tag: rl_supine_to_stance
    manual_transition: [passive]
    auto_transition: walk
    key: [START, CROSS_X_UP]

  - motion: qualifier_front_kick
    period: 0.02
    runner: [{name: rl_dance_example_runner, enabled: true, param_tag: qualifier_front_kick}]
    manual_transition: [passive, pd_stand]
    auto_transition: pd_stand
    key: [RB, A]

  - motion: qualifier_straight_punch
    period: 0.02
    runner: [{name: rl_dance_example_runner, enabled: true, param_tag: qualifier_straight_punch}]
    manual_transition: [passive, pd_stand]
    auto_transition: pd_stand
    key: [RB, Y]

  - motion: qualifier_hook_punch
    period: 0.02
    runner: [{name: rl_dance_example_runner, enabled: true, param_tag: qualifier_hook_punch}]
    manual_transition: [passive, pd_stand]
    auto_transition: pd_stand
    key: [LB, B]

  - motion: qualifier_jab_left
    period: 0.02
    runner: [{name: rl_dance_example_runner, enabled: true, param_tag: qualifier_jab_left}]
    manual_transition: [passive, pd_stand]
    auto_transition: pd_stand
    key: [RB, B]
