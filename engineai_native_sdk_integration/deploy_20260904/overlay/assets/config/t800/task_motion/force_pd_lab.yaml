# Isolated hardware-lab graph. The independent staged package must map its
# motion_task scope to this file; the normal qualifier graph remains untouched.
cpu:
  number: 3
  priority: 10

tasks:
  - motion: idle
    period: 0.002
    runner:
      - name: idle_runner
        enabled: true
    manual_transition: [passive]
    key: [LB, START]

  - motion: passive
    period: 0.002
    runner:
      - name: passive_runner
        enabled: true
    manual_transition: [idle, pd_stand, pd_stand_x, pd_stand_y]
    key: [LB, RB]

  - motion: pd_stand
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand
    manual_transition: [passive, pd_stand_x, pd_stand_y]
    key: [LB, A]

  - motion: pd_stand_x
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand_x
    manual_transition: [passive, pd_stand, pd_stand_y]
    key: [LB, X]

  - motion: pd_stand_y
    period: 0.002
    runner:
      - name: pd_stand_runner
        enabled: true
        param_tag: pd_stand_y
    manual_transition: [passive, pd_stand, pd_stand_x]
    key: [LB, Y]
